<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Emplacement pour la photo du promoteur">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="640" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1326"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="fm-glow" cx="320" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a83ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4a83ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fm-body" x1="150" y1="540" x2="500" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a83ff"/>
      <stop offset="1" stop-color="#1ec8d8"/>
    </linearGradient>
    <linearGradient id="fm-head" x1="240" y1="170" x2="400" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ba6ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="fm-gold" x1="120" y1="120" x2="520" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="1" stop-color="#e6ad3f"/>
    </linearGradient>
  </defs>

  <rect width="640" height="800" fill="url(#fm-bg)"/>
  <rect width="640" height="800" fill="url(#fm-glow)"/>

  <ellipse
    cx="320"
    cy="330"
    rx="292"
    ry="120"
    fill="none"
    stroke="url(#fm-gold)"
    stroke-width="2"
    stroke-opacity="0.4"
    transform="rotate(-24 320 330)"
  />

  <circle cx="320" cy="268" r="104" fill="url(#fm-head)"/>
  <circle cx="320" cy="268" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <path d="M126 800c8-142 88-236 194-236s186 94 194 236z" fill="url(#fm-body)"/>

  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="286" y="452" width="68" height="10" rx="5"/>
    <rect x="286" y="500" width="68" height="10" rx="5" fill-opacity="0.45"/>
  </g>
</svg>
